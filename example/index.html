<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fixes example</title>
<style>
  body { margin: 0; padding: 48px; font-family: system-ui, sans-serif; background: #15171c; color: #eef0f4; max-width: 640px; }
  h1 { font-weight: 800; }
  p { line-height: 1.6; color: #c7cbd3; }
  a { color: #3b86ff; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #3b86ff; color: #fff; font-weight: 700; }
</style>
</head>
<body>
  <h1>Welcome to the example app</h1>
  <p id="intro">This paragraph has a <a href="#" id="link">link in the middle</a> that keeps working while you edit around it.</p>
  <p id="second">Click any text to rewrite it. Press Enter to save, Escape to cancel. Shift+Enter adds a line break.</p>
  <button id="cta">Sign up now</button>
  <script src="http://localhost:4777/fixes.js"></script>
</body>
</html>
